name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-static-integration:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and SpecEdge submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python for FastSD CPU tests
        id: fastsd
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FastSD CPU test dependencies
        run: >-
          python -m pip install torch==2.6.0 transformers==4.57.6
          accelerate==1.12.0 fastapi==0.128.0 uvicorn==0.40.0 requests==2.32.5

      - name: Set up Python for official SpecEdge source checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run repository-wide integration checks
        env:
          FASTSD_TEST_PYTHON: ${{ steps.fastsd.outputs.python-path }}
          PYTHONUTF8: "1"
        run: python scripts/run_tests.py --strict-official --test-python "$env:FASTSD_TEST_PYTHON"
