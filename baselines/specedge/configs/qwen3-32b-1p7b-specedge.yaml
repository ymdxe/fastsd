# Figure 10 uses depth 7 near 15 ms RTT for this pair; recalibrate on your GPUs.
version: 1
opt: 2
base:
  result_path: result/paper
  exp_name: specedge-qwen3-32b-1p7b
  dtype: fp16
  seed: 42
  ssh_key: ~/.ssh/id_ed25519_server
  max_len: 2048
server:
  process_name: server
  target_model: Qwen/Qwen3-32B
  device: cuda:0
  temperature: 0.7
  max_batch_size: 1
  num_clients: 2
  batch_type: static
  cache_prefill: true
client:
  host: server.example.internal:8000
  process_name: client
  draft_model: Qwen/Qwen3-1.7B
  dataset: specbench
  reasoning: false
  sample_req_cnt: 8
  req_offset: 0
  max_n_beams: 32
  max_beam_len: 7
  max_branch_width: 16
  max_budget: 32
  proactive:
    type: excluded
    max_n_beams: 32
    max_beam_len: 3
    max_branch_width: 16
    max_budget: 32
  max_new_tokens: 256
  max_request_num: -1
node:
  edge-a:
    - device: cuda:0
  edge-b:
    - device: cuda:0
